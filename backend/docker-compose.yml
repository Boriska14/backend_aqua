services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: aquasafe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aquasafe
      POSTGRES_PASSWORD: aquasafe_dev_password
      POSTGRES_DB: aquasafe
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aquasafe -d aquasafe']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: aquasafe-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/aquasafe-documents;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:

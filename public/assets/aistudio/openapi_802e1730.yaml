      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardMinee" } } } } }
  /dashboard/commune:
    get:
      tags: [Pilotage]
      summary: Tableau de bord de la commune de l'appelant (EF-30)
      x-roles: [AGENT_COMMUNAL]
      responses: { "200": { description: OK } }
  /notifications:
    get:
      tags: [Pilotage]
      summary: Notifications in-app de l'utilisateur
      parameters: [{ name: unreadOnly, in: query, schema: { type: boolean } }, { $ref: "#/components/parameters/Page" }]
      responses: { "200": { description: OK } }
  /notifications/{id}/read:
    post:
      tags: [Pilotage]
      summary: Marque comme lue
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: OK } }

  # ───────────── ADMIN ─────────────
  /users:
    get:
      tags: [Admin]
      summary: Comptes (filtre rôle/statut)
      x-roles: [ADMIN]
      responses: { "200": { description: OK } }
    post:
      tags: [Admin]
      summary: Crée un compte staff (MINEE, labo, agent communal, préleveur…) — mot de passe initial à changer
      x-roles: [ADMIN]
      x-strong-auth: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserCreate" } } }
      responses: { "201": { description: Créé } }
  /users/{id}:
    patch:
      tags: [Admin]
      summary: Statut, rôle, périmètre ; reset 2FA
      x-roles: [ADMIN]
      x-strong-auth: true
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /audit-logs:
    get:
      tags: [Admin]
      summary: Journal d'audit (lecture seule)
      x-roles: [MINEE, ADMIN]
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: OK } }
  /audit-logs/verify-chain:
    get:
      tags: [Admin]
      summary: Vérifie l'intégrité de la chaîne SHA-256 (renvoie les seq rompus)
      x-roles: [MINEE, ADMIN]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  checked: { type: integer }
                  brokenSeq: { type: array, items: { type: integer } }
  /exports/system:
    post:
      tags: [Admin]
      summary: Export complet données + métadonnées de fichiers (réversibilité EN-12)
      x-roles: [ADMIN]
      x-strong-auth: true
      responses: { "202": { description: Export planifié } }

  # ───────────── SYSTÈME ─────────────
  /health:
    get:
      tags: [Systeme]
      summary: Liveness / readiness (base, stockage, file de notifications)
      security: []
      responses: { "200": { description: OK }, "503": { description: Dégradé } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string, format: uuid } }

  responses:
    Problem:
      description: Erreur métier ou validation (RFC 7807)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooMany:
      description: Limite de fréquence atteinte
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Session:
      description: Session ouverte
      content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, example: GRID_INACTIVE }
        detail: { type: string }
        errors: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
        traceId: { type: string }
    Session:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        user: { $ref: "#/components/schemas/User" }
    MfaChallenge:
      type: object
      properties:
        mfaRequired: { type: boolean, example: true }
        mfaToken: { type: string }
        mfaEnrolled: { type: boolean }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        locale: { type: string }
        communeId: { type: integer, nullable: true }
        laboratoireId: { type: string, format: uuid, nullable: true }
        mfaEnabled: { type: boolean }
    UserCreate:
      type: object
      required: [role, fullName, phone]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        communeId: { type: integer }
        laboratoireId: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        habilitationUntil: { type: string, format: date }
    Role:
      type: string
      enum: [PROPRIETAIRE, ENTREPRISE_FORAGE_ONG, AGENT_COMMUNAL, AGENT_PRELEVEUR, LABORATOIRE, ENTREPRISE_TRAITEMENT, MINEE, ADMIN]
    OuvrageType: { type: string, enum: [FORAGE, PUITS_AMENAGE] }
    OuvrageStatus: { type: string, enum: [NON_ENREGISTRE_CERTIF, EN_ATTENTE, CERTIFIE, NON_CONFORME, CERTIF_EXPIREE, HORS_SERVICE] }
    PublicStatus: { type: string, enum: [CERTIFIE, EXPIRE, SUSPENDU, RETIRE, NON_CERTIFIE] }
    DemandeType: { type: string, enum: [INITIALE, RENOUVELLEMENT] }
    DemandeStatus:
      type: string
      enum: [BROUILLON, SOUMISE, VALIDEE_COMMUNE, EN_ATTENTE_PAIEMENT, PRELEVEMENT_PLANIFIE, PRELEVE, EN_ANALYSE, ANALYSE_SOUMISE, EN_VALIDATION_MINEE, CERTIFIEE, NON_CONFORME, EN_CONTRE_ANALYSE, REJETEE, ANNULEE]
    PrelevementStatus: { type: string, enum: [PLANIFIE, REALISE, TRANSMIS_LABO, RECU_LABO, REJETE_LABO] }
    AnalyseStatus: { type: string, enum: [EN_SAISIE, SOUMISE, AMENDEE] }
    Verdict: { type: string, enum: [CONFORME, NON_CONFORME, NON_CONFORME_GRAVE] }
    CertificatStatus: { type: string, enum: [EMIS, ACTIF, SUSPENDU, EXPIRE, RETIRE, REMPLACE] }
    PaiementCanal: { type: string, enum: [ORANGE_MONEY, MTN_MOMO, ESPECES, VIREMENT, AUTRE] }
    SignalementStatus: { type: string, enum: [RECU, PRIS_EN_CHARGE, ESCALADE_MINEE, RESOLU, REJETE] }
    SignalementCategorie:
      type: string
      enum: [EAU_SUSPECTE, PLAQUE_ABSENTE_DEGRADEE, OUVRAGE_NON_ENREGISTRE, FRAUDE_PRESUMEE, OUVRAGE_DEGRADE, INFO_INCORRECTE, CERTIF_AFFICHEE_EXPIREE, AUTRE]
    DocumentKind:
      type: string
      enum: [IDENTIFICATION, TECHNIQUE, PV_ANALYSE, CERTIFICAT_PDF, RECU_PDF, RAPPORT_TRAITEMENT, RAPPORT_CONTROLE, PHOTO_PRELEVEMENT, PHOTO_SIGNALEMENT, JUSTIFICATIF_SUBVENTION, AUTRE]
    OrganisationType: { type: string, enum: [ENTREPRISE_FORAGE, ONG, ENTREPRISE_TRAITEMENT, PROGRAMME_RSE, COMITE_GESTION] }

    PublicVerification:
      type: object
      required: [state, pilot]
      properties:
        state: { type: string, enum: [ACTIVE, SUSPENDED, EXPIRED, WITHDRAWN, UNKNOWN] }
        pilot: { type: boolean, example: true, description: "Affiche « Pilote en cours de validation »" }
        ouvrage:
          type: object
          nullable: true
          description: "Absent si UNKNOWN. Jamais de propriétaire."
          properties:
            aquasafeNumber: { type: string }
            name: { type: string }
            village: { type: string }
            communeName: { type: string }
        certificat:
          type: object
          nullable: true
          properties:
            number: { type: string }
            validFrom: { type: string, format: date }
            validUntil: { type: string, format: date }
            referentiel: { type: string, example: "NC 207 v1" }
            expiresInDays: { type: integer }
        lastControlAt: { type: string, format: date, nullable: true }
        guidanceCode: { type: string, description: "Clé i18n de la conduite à tenir par état" }
        reportUrl: { type: string, description: "Lien vers le signalement pré-rempli (QR inconnu)" }
    PublicOuvrage:
      type: object
      properties:
        aquasafeNumber: { type: string }
        name: { type: string }
        village: { type: string }
        communeName: { type: string }
        type: { $ref: "#/components/schemas/OuvrageType" }
        publicStatus: { $ref: "#/components/schemas/PublicStatus" }
        validUntil: { type: string, format: date, nullable: true }
        lastControlAt: { type: string, format: date, nullable: true }
        latitude: { type: number }
        longitude: { type: number }
    PublicOuvragePage:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/PublicOuvrage" } }
        meta: { $ref: "#/components/schemas/Meta" }
    Meta:
      type: object
      properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } }

    OuvrageCreate:
      type: object
      required: [type, name, communeId, latitude, longitude]
      properties:
        sieId: { type: string }
        type: { $ref: "#/components/schemas/OuvrageType" }
        usage: { type: string, enum: [DOMESTIQUE, COMMUNAUTAIRE, COMMERCIAL, INSTITUTIONNEL] }
        name: { type: string }
        village: { type: string }
        communeId: { type: integer }
        latitude: { type: number, minimum: 1.6, maximum: 13.1 }
        longitude: { type: number, minimum: 8.4, maximum: 16.2 }
        gpsAccuracyM: { type: integer }
        yearBuilt: { type: integer }
        ownerPhone: { type: string, description: "Rattache un propriétaire existant ou invite (commune/entreprise)" }
    OuvrageUpdate:
      type: object
      properties:
        name: { type: string }
        village: { type: string }
        usage: { type: string }
        status: { type: string, enum: [HORS_SERVICE], description: "Autres statuts pilotés par le workflow uniquement" }
    Ouvrage:
      allOf:
        - { $ref: "#/components/schemas/OuvrageCreate" }
        - type: object
          properties:
            id: { type: string, format: uuid }
            aquasafeNumber: { type: string }
            status: { $ref: "#/components/schemas/OuvrageStatus" }
            lastControlAt: { type: string, format: date-time, nullable: true }
            currentCertificat: { $ref: "#/components/schemas/Certificat" }
    OuvragePage:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Ouvrage" } }
        meta: { $ref: "#/components/schemas/Meta" }
    Dossier:
      type: object
      properties:
        ouvrageId: { type: string, format: uuid }
        documents: { type: array, items: { type: object } }
        demandes: { type: array, items: { $ref: "#/components/schemas/Demande" } }
        certificats: { type: array, items: { $ref: "#/components/schemas/Certificat" } }
        timeline: { type: array, items: { type: object, properties: { at: { type: string, format: date-time }, event: { type: string }, actor: { type: string } } } }
    SieImportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [RUNNING, DONE, FAILED] }
        totalRows: { type: integer }
        createdRows: { type: integer }
        updatedRows: { type: integer }
        skippedRows: { type: integer }
        errorRows: { type: integer }
        errors: { type: array, items: { type: object, properties: { row: { type: integer }, field: { type: string }, message: { type: string } } } }

    Demande:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        ouvrageId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/DemandeType" }
        status: { $ref: "#/components/schemas/DemandeStatus" }
        step: { type: integer, minimum: 1, maximum: 6, description: "Étape affichée (6 étapes du parcours)" }
        laboratoireId: { type: string, format: uuid, nullable: true }
        tarifAmount: { type: integer, nullable: true }
        subventionAmount: { type: integer }
        amountPaid: { type: integer }
        balanceDue: { type: integer }
        history: { type: array, items: { type: object, properties: { at: { type: string, format: date-time }, from: { type: string }, to: { type: string }, actor: { type: string } } } }
    Paiement:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer }
        canal: { $ref: "#/components/schemas/PaiementCanal" }
        reference: { type: string }
        status: { type: string, enum: [DECLARE, CONFIRME, REJETE] }
    Recu:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        amount: { type: integer }
        balanceAfter: { type: integer }

    PrelevementCreate:
      type: object
      required: [clientUuid, demandeId, bottleCode, collectedAt, latitude, longitude]
      properties:
        clientUuid: { type: string, format: uuid }
        demandeId: { type: string, format: uuid }
        bottleCode: { type: string }
        collectedAt: { type: string, format: date-time }
        latitude: { type: number }
        longitude: { type: number }
        gpsAccuracyM: { type: integer }
        waterTempC: { type: number }
        transportTempC: { type: number }
        transportNotes: { type: string }
    Prelevement:
      allOf:
        - { $ref: "#/components/schemas/PrelevementCreate" }
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/PrelevementStatus" }
            laboratoireId: { type: string, format: uuid }
    Analyse:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/AnalyseStatus" }
        verdict: { $ref: "#/components/schemas/Verdict" }
        referentiel: { type: string }
        values:
          type: array
          items:
            type: object
            properties:
              parameterCode: { type: string }
              label: { type: string }
              unit: { type: string }
              value: { type: number }
              min: { type: number, nullable: true }
              max: { type: number, nullable: true }
              isCompliant: { type: boolean }
    ProcesVerbal:
      type: object
      properties:
        id: { type: string, format: uuid }
        sha256: { type: string }
        receivedAt: { type: string, format: date-time }
    Certificat:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        status: { $ref: "#/components/schemas/CertificatStatus" }
        issuedAt: { type: string, format: date-time }
        validFrom: { type: string, format: date, nullable: true }
        validUntil: { type: string, format: date, nullable: true }
        expiringSoon: { type: boolean, description: "Dérivé : validUntil - now <= 60 jours" }
        referentiel: { type: string }
        transitions:
          type: array
          items:
            type: object
            properties:
              from: { type: string, nullable: true }
              to: { type: string }
              reason: { type: string }
              actor: { type: string, nullable: true }
              at: { type: string, format: date-time }
    ReasonBody:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 10 } }

    SignalementCreate:
      type: object
      required: [category]
      properties:
        clientUuid: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/SignalementCategorie" }
        description: { type: string, maxLength: 1000 }
        latitude: { type: number }
        longitude: { type: number }
        qrToken: { type: string, description: "Si le signalement vient d'un scan" }
        contactPhone: { type: string }
        photos: { type: array, maxItems: 3, items: { type: string, format: binary } }
    SignalementReceipt:
      type: object
      properties:
        trackingNumber: { type: string, example: SG-7K2M9Q }
        status: { $ref: "#/components/schemas/SignalementStatus" }

    Seuil:
      type: object
      required: [parameterCode, label, type]
      properties:
        parameterCode: { type: string }
        label: { type: string }
        type: { type: string, enum: [PHYSICO_CHIMIQUE, BACTERIOLOGIQUE] }
        unit: { type: string }
        minValue: { type: number, nullable: true }
        maxValue: { type: number, nullable: true }
        isCritical: { type: boolean }
        isMandatory: { type: boolean }
    GrilleCreate:
      type: object
      required: [name, lignes]
      properties:
        name: { type: string }
        lignes:
          type: array
          items:
            type: object
            required: [ouvrageType, usage, amount]
            properties:
              ouvrageType: { $ref: "#/components/schemas/OuvrageType" }
              usage: { type: string }
              amount: { type: integer, minimum: 0 }
    LaboratoireCreate:
      type: object
      required: [name, agrementNumber, scopeAccreditation]
      properties:
        name: { type: string }
        agrementNumber: { type: string }
        agrementValidUntil: { type: string, format: date }
        scopeAccreditation: { type: array, items: { type: string } }
        communeId: { type: integer }
        phone: { type: string }
        email: { type: string }
        isReferenced: { type: boolean }
    DashboardMinee:
      type: object
      properties:
        ouvragesTotal: { type: integer }
        ouvragesCertifies: { type: integer }
        tauxCouverture: { type: number }
        tauxConformite: { type: number }
        delaiMoyenDemandeValidationJours: { type: number }
        certificatsExpirantDans60Jours: { type: integer }
        certificatsExpires: { type: integer }
        signalementsOuverts: { type: integer }
        parCommune: { type: array, items: { type: object } }
        generatedAt: { type: string, format: date-time }
